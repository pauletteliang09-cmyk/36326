const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='p36326-unlock';
async function deriveRaw(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,256));}
async function openWith(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.ct));return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
const enc=a=>btoa(String.fromCharCode(...a));
function stored(){try{return sessionStorage.getItem(KEY)||localStorage.getItem(KEY)}catch(e){return null}}
function forget(){try{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY)}catch(e){}}
(async()=>{const s=stored();if(!s)return;try{show(await openWith(b64(s)));}catch(e){forget();}})();
document.getElementById('sh').onclick=()=>{const i=document.getElementById('p');const t=i.type==='password';i.type=t?'text':'password';document.getElementById('sh').textContent=t?'Hide':'Show';};
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();const e=document.getElementById('e'),go=document.getElementById('go');e.textContent='';
  if(!window.crypto||!crypto.subtle){e.textContent='This browser cannot unlock the page. Please use Chrome, Safari or Edge.';return;}
  go.disabled=true;go.textContent='Unlocking… 解锁中';
  try{const raw=await deriveRaw(document.getElementById('p').value);const html=await openWith(raw);
    try{sessionStorage.setItem(KEY,enc(raw));if(document.getElementById('rm').checked)localStorage.setItem(KEY,enc(raw));}catch(x){}
    show(html);}
  catch(x){e.textContent='Wrong password. Please try again. 密码错误，请重试。';go.disabled=false;go.textContent='Unlock · 解锁';}};
</script>
